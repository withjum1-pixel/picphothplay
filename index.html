<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📸 재미있는 사진 찍기</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Round+Square:wght@400;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --pink:#FF6B9D;--yellow:#FFD93D;--mint:#6BCB77;--blue:#4D96FF;
  --orange:#FF9F43;--purple:#C77DFF;--red:#FF4757;--bg:#FFF9F0;
}
body{font-family:'Nanum Round Square',sans-serif;background:var(--bg);color:#333;
  min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden;}

/* ── 화면 전환 ── */
.screen{display:none;min-height:100vh;padding-bottom:90px;}
.screen.on{display:block;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pop{0%{transform:scale(0);opacity:0}80%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes rainbow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes cdPop{0%{transform:scale(2.5);opacity:0}30%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(.3)}}

/* ── 공통 버튼 ── */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border:none;
  border-radius:1rem;padding:16px 20px;font-size:16px;font-weight:800;
  cursor:pointer;font-family:inherit;width:100%;transition:transform .15s,box-shadow .15s;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-pink{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 6px 20px rgba(255,107,157,.35);}
.btn-green{background:linear-gradient(135deg,var(--mint),#26de81);color:#fff;box-shadow:0 6px 20px rgba(107,203,119,.35);}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:0 6px 20px rgba(77,150,255,.35);}
.btn-yellow{background:linear-gradient(135deg,var(--yellow),var(--orange));color:#fff;box-shadow:0 6px 20px rgba(255,159,67,.35);}
